[package]
name = "hlsgrab"
version = "0.1.0"
edition = "2024"

[profile.release]
strip = "symbols"
debug = false
opt-level = "z"
lto = "fat"
panic = "abort"
codegen-units = 1
split-debuginfo = "unpacked"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
cliclack = "0.5.4"
ctrlc = { version = "3.5.2", features = ["termination"] }
futures-util = "0.3.32"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.4", default-features = false, features = ["http2", "default-tls", "rustls", "stream", "socks", "gzip", "brotli", "deflate", "zstd"] }
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
