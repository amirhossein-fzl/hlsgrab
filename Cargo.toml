[package]
name = "m3u8-dl"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
futures-util = "0.3.32"
reqwest = { version = "0.13.4", default-features = false, features = ["http2", "default-tls", "rustls", "stream", "socks"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
